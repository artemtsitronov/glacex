[package]
name = "glacex"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "GPU-accelerated, immediate-mode GPU UI library built from scratch in Rust — Geist typography, SDF rendering, shadcn-grade design system"
license = "MIT"
repository = "https://github.com/artemtsitronov/glacex"
keywords = ["gui", "wgpu", "ui", "immediate-mode", "graphics"]
categories = ["gui", "graphics", "rendering"]
# Fonts are embedded at compile-time via include_bytes! and must travel with
# the source tree on crates.io. List them explicitly so they are included in
# the published crate even though they live outside src/.
include = [
    "src/**/*",
    "assets/fonts/*.ttf",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
arboard = "3.6.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glyphon = "0.12.0"
pollster = "1.0.1"
taffy = "0.13.0"
wgpu = "30.0.0"
winit = "0.30.13"
